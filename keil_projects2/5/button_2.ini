// buttons.ini для варианта 24
// Линии: PA0, PB1, PA2, PA4

KILL BUTTON 4
KILL BUTTON 3
KILL BUTTON 2
KILL BUTTON 1

OSC = 8000000;

// Устанавливаем начальные значения (pull-up = 1)
PORTA |= 0x0015;  // PA0=1, PA2=1, PA4=1
PORTB |= 0x0002;  // PB1=1

SIGNAL void toggle_A0() {
    PORTA &= ~0x01;    // PA0 = 0
    swatch(0.02);      // ждать 20 мс
    PORTA |= 0x01;     // PA0 = 1
}

SIGNAL void toggle_B1() {
    PORTB &= ~0x02;    // PB1 = 0
    swatch(0.02);
    PORTB |= 0x02;     // PB1 = 1
}

SIGNAL void toggle_A2() {
    PORTA &= ~0x04;    // PA2 = 0
    swatch(0.02);
    PORTA |= 0x04;     // PA2 = 1
}

SIGNAL void toggle_A4() {
    PORTA &= ~0x10;    // PA4 = 0
    swatch(0.02);
    PORTA |= 0x10;     // PA4 = 1
}

DEFINE BUTTON "Key PA0", "toggle_A0()"
DEFINE BUTTON "Key PB1", "toggle_B1()"
DEFINE BUTTON "Key PA2", "toggle_A2()"
DEFINE BUTTON "Key PA4", "toggle_A4()"